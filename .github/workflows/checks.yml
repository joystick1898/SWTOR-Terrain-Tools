name: Portable checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check formatting
        run: python -m black --check swtor_terrain_tools tests scripts
      - name: Run portable regressions
        run: python -m unittest discover -s tests -v
      - name: Build installer and checksum
        run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: installer-python-${{ matrix.python-version }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
